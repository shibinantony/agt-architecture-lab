name: AGT architecture lab validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Update pinned installer and build tooling
        run: python -m pip install -r requirements-bootstrap.txt

      - name: Install lab and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Verify runtime, MCP stdio and decision schemas
        run: python -m unittest discover -s tests -v

      - name: Run offline evidence demo
        run: python -m lab demo --output artifacts/ci

      - name: Validate required files, JSON, and local links
        shell: pwsh
        run: ./tests/Test-Repository.ps1

      - name: Validate documentation links and heading fragments
        run: python tests/check_links.py

      - name: Preserve synthetic demo evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: synthetic-evidence-${{ matrix.os }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7

  upstream-agt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Update pinned installer and build tooling
        run: python -m pip install -r requirements-bootstrap.txt
      - name: Verify native source-build prerequisites
        run: |
          rustc --version
          cargo --version
      - name: Install pinned upstream AGT in the isolated job
        run: python -m pip install -r examples/upstream-agt/requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Verify actual AGT allow and deny behavior
        run: python examples/upstream-agt/run.py
      - name: Audit installed upstream dependencies with isolated tooling
        run: |
          python -m venv artifacts/qa-venv
          artifacts/qa-venv/bin/python -m pip install -r requirements-bootstrap.txt
          artifacts/qa-venv/bin/python -m pip install -r requirements-audit.txt
          artifacts/qa-venv/bin/python -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" --strict --progress-spinner off
