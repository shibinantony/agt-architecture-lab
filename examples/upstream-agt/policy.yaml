# Original synthetic example for the released AgentMesh govern() wrapper.
# This is not the local simulator's schema or a native ACS manifest.
apiVersion: governance.toolkit/v1
version: "1.0"
name: synthetic-catalog-policy
default_action: deny
rules:
  - name: allow-catalog-read
    condition: "action.type == 'read_catalog'"
    action: allow
    description: Read the fixed synthetic catalog.
  - name: deny-destructive-actions
    condition: "action.type in ['delete_catalog', 'shell_exec']"
    action: deny
    description: Destructive actions and shell execution are outside this example.
